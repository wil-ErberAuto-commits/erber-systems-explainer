<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude reference vs Erber HUD light</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  /* Comparison sheet only. The left pane is a recreation of the Claude desktop Customize screen
     (Wil's reference screenshot), drawn with approximate dark colours that are NOT part of the system. */
  body { background: var(--color-surface); }
  .sheet { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); padding: var(--space-6); }
  .cap { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: var(--space-3); }
  .cap p:first-child { font-weight: var(--weight-semibold); }
  .pane { height: 548px; overflow: hidden; border: var(--border); border-radius: var(--radius-lg); display: grid; grid-template-columns: 184px minmax(0, 1fr); }

  .ref { background: #262624; color: #F2F1EC; border-color: #262624; }
  .ref-side { background: #1F1E1D; padding: var(--space-4) var(--space-2); display: flex; flex-direction: column; gap: var(--space-1); }
  .ref-item { height: var(--space-8); display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); border-radius: var(--radius-md); color: #E9E7E0; }
  .ref-item.on { background: #3A3936; }
  .ref-label { font-size: var(--text-xs); color: #A19E95; padding: var(--space-4) var(--space-2) var(--space-1); }
  .ref-main { padding: var(--space-8) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
  .ref-title { font-family: Georgia, "Times New Roman", serif; font-size: var(--text-xl); font-weight: var(--weight-regular); }
  .ref-bar { display: flex; align-items: center; gap: var(--space-2); }
  .ref-tab { height: var(--space-8); padding: 0 var(--space-3); display: inline-flex; align-items: center; border-radius: var(--radius-md); color: #D8D6CE; }
  .ref-tab.on { background: #3A3936; color: #F2F1EC; }
  .ref-seg { display: inline-flex; gap: var(--space-1); padding: var(--space-1); background: #30302E; border-radius: var(--radius-md); }
  .ref-seg span { height: var(--space-6); padding: 0 var(--space-2); display: inline-flex; align-items: center; border-radius: var(--radius-sm); }
  .ref-seg .on { background: #4A4945; }
  .ref-search { flex: 1; height: var(--space-8); border: 1px solid #3D3D3A; border-radius: var(--radius-md); background: #30302E; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); color: #A19E95; }
  .ref-btn { height: var(--space-8); padding: 0 var(--space-3); display: inline-flex; align-items: center; gap: var(--space-1); border-radius: var(--radius-md); background: #F2F1EC; color: #1F1E1D; font-weight: var(--weight-medium); }
  .ref-head { display: flex; justify-content: space-between; align-items: center; font-weight: var(--weight-medium); }
  .ref-count { font-size: var(--text-xs); background: #3A3936; color: #A19E95; padding: 0 var(--space-2); border-radius: var(--radius-sm); margin-left: var(--space-2); }
  .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .ref-card { display: grid; grid-template-columns: var(--space-8) minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-3); background: #30302E; border: 1px solid #3D3D3A; border-radius: var(--radius-lg); }
  .ref-tile { width: var(--space-8); height: var(--space-8); border-radius: var(--radius-md); background: #F2F1EC; color: #1F1E1D; display: grid; place-items: center; }
  .ref-sub { color: #A19E95; font-size: var(--text-xs); margin-top: var(--space-1); }
  .ref-act { width: var(--space-6); height: var(--space-6); border-radius: var(--radius-sm); background: #4A4945; display: grid; place-items: center; }

  .ours .sidebar { padding: var(--space-4) var(--space-2); }
  .ours .side-item { height: var(--space-8); }
  .ours-main { background: var(--color-canvas); padding: var(--space-8) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
  .ours-bar { display: flex; align-items: center; gap: var(--space-2); }
  .ours-bar .search { flex: 1; }
  .ours-head { display: flex; justify-content: space-between; align-items: center; }
  .ours .card { padding: var(--space-3); grid-template-columns: var(--space-8) minmax(0, 1fr) auto; }
  .ours .tile { width: var(--space-8); height: var(--space-8); }
  .ours .card-sub { font-size: var(--text-xs); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6l-6 4H4a1 1 0 0 0-1 1zM17 8.5a5 5 0 0 1 0 7"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></symbol>
  <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
</defs></svg>

<div class="sheet">
  <figure>
    <figcaption class="cap"><p>Reference: Claude desktop, Customize (dark)</p><p class="meta">Recreated from Wil's screenshot · qualities only</p></figcaption>
    <div class="pane ref">
      <nav class="ref-side">
        <span class="ref-item"><svg class="ico ico-sm"><use href="#i-plus"/></svg>New</span>
        <span class="ref-item"><svg class="ico ico-sm"><use href="#i-search"/></svg>Search</span>
        <span class="ref-item"><svg class="ico ico-sm"><use href="#i-grid"/></svg>Artifacts</span>
        <span class="ref-item on"><svg class="ico ico-sm"><use href="#i-sliders"/></svg>Customize</span>
        <span class="ref-label">Agent Projects ▾</span>
        <span class="ref-item">Project one</span>
        <span class="ref-item">Project two</span>
        <span class="ref-label">mac-mini-1 ▾</span>
        <span class="ref-item">Project three</span>
        <span class="ref-item">Project four</span>
      </nav>
      <div class="ref-main">
        <p class="ref-title">Customize</p>
        <div class="ref-bar">
          <span class="ref-tab">Skills</span><span class="ref-tab on">Connectors</span><span class="ref-tab">Plugins</span>
          <span class="ref-seg"><span>Yours</span><span class="on">Discover</span></span>
        </div>
        <div class="ref-bar"><span class="ref-search"><svg class="ico ico-sm"><use href="#i-search"/></svg>Search</span><span class="ref-btn"><svg class="ico ico-sm"><use href="#i-plus"/></svg>Add</span></div>
        <p class="ref-head"><span>Top connectors<span class="ref-count">8199</span></span><span class="ref-sub">Show all →</span></p>
        <div class="ref-grid">
          <div class="ref-card"><span class="ref-tile"><svg class="ico ico-sm"><use href="#i-database"/></svg></span><div><p>Drive</p><p class="ref-sub">Search, read and upload files</p><p class="ref-sub">by Vendor</p></div><span class="ref-act"><svg class="ico ico-sm"><use href="#i-plus"/></svg></span></div>
          <div class="ref-card"><span class="ref-tile"><svg class="ico ico-sm"><use href="#i-message"/></svg></span><div><p>Mail</p><p class="ref-sub">Draft replies, summarize threads</p><p class="ref-sub">by Vendor</p></div><span class="ref-act"><svg class="ico ico-sm"><use href="#i-check"/></svg></span></div>
          <div class="ref-card"><span class="ref-tile"><svg class="ico ico-sm"><use href="#i-calendar"/></svg></span><div><p>Calendar</p><p class="ref-sub">Manage your schedule</p><p class="ref-sub">by Vendor</p></div><span class="ref-act"><svg class="ico ico-sm"><use href="#i-check"/></svg></span></div>
          <div class="ref-card"><span class="ref-tile"><svg class="ico ico-sm"><use href="#i-grid"/></svg></span><div><p>Workspace</p><p class="ref-sub">Search and update pages</p><p class="ref-sub">by Vendor</p></div><span class="ref-act"><svg class="ico ico-sm"><use href="#i-plus"/></svg></span></div>
        </div>
      </div>
    </div>
  </figure>

  <figure>
    <figcaption class="cap"><p>Erber HUD light: same qualities, our tokens</p><p class="meta">Translation specimen, not a page design</p></figcaption>
    <div class="pane ours">
      <nav class="sidebar" aria-label="Sidebar">
        <a href="#" class="side-item" aria-current="page"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-phone"/></svg>Current caller</a>
        <a href="#" class="side-item"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-home"/></svg>Overview<span class="side-count">0</span></a>
        <a href="#" class="side-item"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-megaphone"/></svg>Outreach<span class="side-count">986</span></a>
        <a href="#" class="side-item"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-sliders"/></svg>Shop tools</a>
        <p class="side-label">Recent customers</p>
        <a href="#" class="side-item">Sample Customer A</a>
        <a href="#" class="side-item">Sample Caller 1</a>
        <p class="side-label">Saved searches</p>
        <a href="#" class="side-item">Fleet accounts</a>
        <a href="#" class="side-item">Declined brakes</a>
      </nav>
      <div class="ours-main">
        <h1 class="page-title">Shop tools</h1>
        <div class="seg" role="tablist" aria-label="Tools">
          <button role="tab" aria-selected="false" tabindex="-1">Connected <span class="count">2</span></button>
          <button role="tab" aria-selected="true">Available <span class="count">4</span></button>
        </div>
        <div class="ours-bar">
          <div class="search" role="search"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-search"/></svg><input type="search" aria-label="Search tools" placeholder="Search"></div>
          <button class="btn btn-primary"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-plus"/></svg>Add</button>
        </div>
        <div class="ours-head"><p class="group-title">Front desk tools <span class="chip chip-count">4</span></p><a class="link" href="#">Show all</a></div>
        <div class="card-grid">
          <article class="card"><span class="tile"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-phone"/></svg></span><div><p class="card-title">Phone system</p><p class="card-sub">Shows the caller when the line rings</p><p class="card-meta">Connected</p></div><button class="btn btn-secondary btn-sm btn-icon" aria-label="Connected"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-check"/></svg></button></article>
          <article class="card"><span class="tile"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-database"/></svg></span><div><p class="card-title">Shop mirror</p><p class="card-sub">Fast local search of ROs</p><p class="card-meta">Synced 12:02 PM</p></div><button class="btn btn-secondary btn-sm btn-icon" aria-label="Connected"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-check"/></svg></button></article>
          <article class="card"><span class="tile"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-message"/></svg></span><div><p class="card-title">Text messages</p><p class="card-sub">Reminders for opted-in customers</p><p class="card-meta">Not set up</p></div><button class="btn btn-secondary btn-sm btn-icon" aria-label="Set up"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-plus"/></svg></button></article>
          <article class="card"><span class="tile"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-wrench"/></svg></span><div><p class="card-title">Parts lookup</p><p class="card-sub">Price and stock from the RO</p><p class="card-meta">Not set up</p></div><button class="btn btn-secondary btn-sm btn-icon" aria-label="Set up"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-plus"/></svg></button></article>
        </div>
      </div>
    </div>
  </figure>
</div>
</body>
</html>
